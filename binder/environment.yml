# Binder (mybinder.org) runtime for the STAT 238 final project.
#
# repo2docker reads THIS file because `binder/` takes precedence over a
# repo-root or subdirectory environment.yml. It mirrors the runtime
# dependencies in `final_project/environment.yml`.
#
#   >>> If you edit final_project/environment.yml, mirror the change here. <<<
#
# IMPORTANT: the editable install of the local `project` package is NOT
# here. repo2docker resolves the conda env in an early Docker layer using
# ONLY this file — the repo source (final_project/) does not exist yet at
# that point, so `-e ./final_project` would fail. The editable install is
# done in `binder/postBuild`, which runs after the full repo is copied in.
#
# (The MyST / Node toolchain is intentionally absent — the published
#  website is built in CI, not inside the Binder image.)

name: stat238-bayes-rl-binder

channels:
  - conda-forge
  - nodefaults

dependencies:
  - python=3.11
  - pip

  # Numerical / data
  - numpy>=1.26,<2.0
  - scipy>=1.14,<1.15
  - pandas>=2.2,<2.3
  - pyarrow>=18,<19

  # Plotting
  - matplotlib>=3.9,<3.10

  # Bayesian stack
  - arviz>=0.20,<0.21
  - pymc>=5.18,<5.19

  # Notebook / dev
  - jupyterlab>=4.3,<5
  - nbconvert>=7.16,<8
  - pytest>=8.3,<9

  - pip:
      - yfinance>=1.3.0,<2.0
      # NOTE: `-e ./final_project` is intentionally NOT here — see header.
      #       It is installed by binder/postBuild instead.
