# Binder (mybinder.org) runtime for the STAT 238 final project.
#
# repo2docker reads THIS file because `binder/` takes precedence over a
# repo-root or subdirectory environment.yml. It mirrors the runtime
# dependencies in `final_project/environment.yml`; the ONLY intentional
# difference is the editable-install path, which must be relative to the
# repo root (repo2docker's build context) instead of `final_project/`.
#
#   >>> If you edit final_project/environment.yml, mirror the change here. <<<
#
# (The MyST / Node toolchain is intentionally absent — the published
#  website is built in CI, not inside the Binder image.)

name: stat238-bayes-rl-binder

channels:
  - conda-forge
  - nodefaults

dependencies:
  - python=3.11
  - pip

  # Numerical / data
  - numpy>=1.26,<2.0
  - scipy>=1.14,<1.15
  - pandas>=2.2,<2.3
  - pyarrow>=18,<19

  # Plotting
  - matplotlib>=3.9,<3.10

  # Bayesian stack
  - arviz>=0.20,<0.21
  - pymc>=5.18,<5.19

  # Notebook / dev
  - jupyterlab>=4.3,<5
  - nbconvert>=7.16,<8
  - pytest>=8.3,<9

  - pip:
      - yfinance>=1.3.0,<2.0
      - -e ./final_project
