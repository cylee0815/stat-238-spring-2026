[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stat238-bayesian-q-learning"
version = "0.1.0"
description = "Hierarchical Bayesian regression for sequential ETF allocation (STAT 238, Spring 2026)."
requires-python = ">=3.11"
readme = "README.md"
authors = [{ name = "Thomas Lee" }]

[tool.hatch.build.targets.wheel]
packages = ["src/project"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: long-running tests (multi-replication coverage checks).",
]

[tool.ruff]
line-length = 100
target-version = "py311"
